name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The Gitea runner image ships without an Android SDK (GitHub's ubuntu-latest has one).
      # Licenses get accepted here; Gradle then downloads the platform/build-tools it needs.
      - uses: android-actions/setup-android@v3
        with:
          # The action's default list includes the retired 'tools' package, which makes sdkmanager fail.
          packages: platform-tools
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          # The act_runner cache server is not reachable from job containers; every
          # cache call would time out and add minutes to the run.
          cache: false
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      # Gitea Actions does not support the v4 artifact protocol yet.
      - uses: actions/upload-artifact@v3
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
